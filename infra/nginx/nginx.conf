# Reverse proxy in front of the owner admin API.
# TLS should be terminated here in production (certbot or a mounted cert).

# Rate limit zones: the API sets its own per-route limits, this is a coarse net.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

upstream owneradmin_backend {
    server backend:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name admin.your-domain.com;

    # Redirect everything except ACME challenges.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.your-domain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 2m;

    # The refresh-token cookie is scoped to this path.
    location /api/v1/auth {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://owneradmin_backend;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-Id $request_id;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://owneradmin_backend;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        proxy_pass http://frontend:80;
        include /etc/nginx/proxy_params;
    }
}
