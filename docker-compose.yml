version: "3.9"

# =========================================================
# Owner Admin Panel — local infrastructure
#   docker compose up -d          # Postgres + Redis + Nginx
#   docker compose --profile app up -d --build
# =========================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: owneradmin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owneradmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-owneradmin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-owneradmin} -d ${POSTGRES_DB:-owneradmin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: owneradmin-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: owneradmin-nginx
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Substituted into nginx.conf at start; see the command below.
      SERVER_NAME: ${SERVER_NAME:-admin.example.com}
    volumes:
      # The config is mounted read-only and copied to a writable path so the
      # substitution does not modify the file on the host.
      - ./infra/nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    profiles: ["app"]
    # The stock image has no envsubst; sed is enough because the config has one
    # variable. `envsubst` would need a second image layer for nothing.
    command: >
      sh -c "sed -e 's/\$${SERVER_NAME}/$${SERVER_NAME}/g'
      /etc/nginx/templates/nginx.conf.template > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"

  backend:
    build:
      context: ./backend
    container_name: owneradmin-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Private signing key is mounted read-only, never baked into the image
      - ./backend/keys:/app/keys:ro
    expose:
      - "4000"
    profiles: ["app"]
    # The image no longer runs migrations on start (Fly runs them in the release
    # command), so local development asks for them explicitly.
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    # Safe to scale to N replicas: the maintenance jobs elect a single leader
    # through a Postgres advisory lock, so only one instance runs them. Every
    # replica still serves API traffic. See docs/ARCHITECTURE.md.
    deploy:
      replicas: 1
      update_config:
        # Never let two versions of the API serve traffic at the same time:
        # the old container must exit before the new one starts.
        order: stop-first
        parallelism: 0

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: owneradmin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    profiles: ["app"]

volumes:
  postgres_data:
  redis_data:
